[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-business-case"
version = "0.1.0"
description = "Cost, ROI and capacity models for automation decisions in service operations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
bizcase = "bizcase.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
